services:
  db:
    image: mysql:8.1
    container_name: assignment-2-webcrafters-db-1
    environment:
      MYSQL_ROOT_PASSWORD: root12345
      MYSQL_DATABASE: cmsdb
      # Optional: Separate user credentials
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot12345"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql
      # Note: Path updated to ./backend/sql because docker-compose is now in the root directory
      - ./backend/sql:/docker-entrypoint-initdb.d

  backend:
    image: sinrou0410/confease-backend:v1.0
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assignment-2-webcrafters-backend-1
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/cmsdb?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root12345
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Note: Path updated to ./backend/uploads for consistent root-level referencing
      - ./backend/uploads:/uploads
    command: >
      java -jar /app.jar

  frontend:
    image: sinrou0410/confease-frontend:v1.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assignment-2-webcrafters-frontend-1
    ports:
      - "4200:80"  # Access via browser at http://localhost:4200
    depends_on:
      - backend

volumes:
  mysql_data: