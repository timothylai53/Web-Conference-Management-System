<form class="space-y-6">
  <div class="form-group">
    <label for="userName" class="block text-sm font-medium text-gray-400">User Name</label>
    <input id="userName" type="text" class="form-control" placeholder="Enter user name">
  </div>
  <div class="form-group">
    <label for="email" class="block text-sm font-medium text-gray-400">Email</label>
    <input id="email" type="email" class="form-control" placeholder="Enter email address">
  </div>
  <div class="form-actions flex justify-end space-x-4">
    <button type="submit" class="btn btn-primary">Submit</button>
    <button type="reset" class="btn btn-ghost">Cancel</button>
  </div>
</form>
