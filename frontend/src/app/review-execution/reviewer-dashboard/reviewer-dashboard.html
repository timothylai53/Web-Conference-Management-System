<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">Reviewer Dashboard</h1>
      <p class="page-subtitle">Review and evaluate assigned conference papers</p>
    </div>
  </div>

  <div class="card" *ngIf="papers.length > 0">
    <table mat-table [dataSource]="papers" class="data-table">

      <!-- Paper Title -->
      <ng-container matColumnDef="paperTitle">
        <th mat-header-cell *matHeaderCellDef> Paper Title </th>
        <td mat-cell *matCellDef="let paper" class="title-cell">
          {{ paper.paperTitle }}
        </td>
      </ng-container>

      <!-- Status -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let paper">
          <span class="status-badge" [ngClass]="{
            'status-completed': paper.status === 'Completed',
            'status-pending': paper.status !== 'Completed'
          }">
            {{ paper.status }}
          </span>
        </td>
      </ng-container>

      <!-- Due Date -->
      <ng-container matColumnDef="dueDate">
        <th mat-header-cell *matHeaderCellDef> Due Date </th>
        <td mat-cell *matCellDef="let paper">
          {{ paper.dueDate | date:'mediumDate' }}
        </td>
      </ng-container>

      <!-- Action -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef style="text-align: right;"> Action </th>
        <td mat-cell *matCellDef="let paper" class="actions-cell">
          <button mat-raised-button class="btn btn-primary"
                  (click)="reviewPaper(paper.assignmentId)">
            Review
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
  </div>

  <div class="card" *ngIf="papers.length === 0">
    <div class="empty-state">
      <div class="empty-icon">📋</div>
      <h3>No review assignments found</h3>
      <p>Review assignments will appear here once they are assigned to you.</p>
    </div>
  </div>
</div>
