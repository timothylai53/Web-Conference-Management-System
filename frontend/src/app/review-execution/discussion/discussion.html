<div class="chat-box">

  <div class="messages">
    <div class="message" *ngFor="let m of messages">
      <strong>{{ m.userName || 'Reviewer' }}:</strong>
      <span>{{ m.message }}</span>
      <small>{{ m.postedAt | date:'short' }}</small>
    </div>
  </div>

  <div class="input-box">
    <input
      [(ngModel)]="newMessage"
      placeholder="Type message..."
      (keyup.enter)="send()"
    />
    <button (click)="send()">Send</button>
  </div>

</div>
