<header class="app-header">
  <div class="logo-area">
    <!-- Only clickable when logged in -->
    <a *ngIf="isLoggedIn" (click)="navigateHome()" class="brand-link" style="cursor: pointer;">
      <div class="brand-icon-wrapper">
        <img src="assets/logo.png" alt="ScholarSync Logo" class="logo-img">
      </div>
      <span class="brand-text">Scholar<span class="text-gradient">Sync</span></span>
    </a>
    <!-- Not clickable when logged out -->
    <div *ngIf="!isLoggedIn" class="brand-link" style="cursor: default;">
      <div class="brand-icon-wrapper">
        <img src="assets/logo.png" alt="ScholarSync Logo" class="logo-img">
      </div>
      <span class="brand-text">Scholar<span class="text-gradient">Sync</span></span>
    </div>
  </div>

  <nav class="main-nav" *ngIf="isLoggedIn">
    <!-- Admin sees all navigation items -->
    <ng-container *ngIf="isAdmin">
      <a routerLink="/conference" routerLinkActive="active" class="nav-item">
        <span>Conferences</span>
      </a>
      <a routerLink="/scheduling-program" routerLinkActive="active" class="nav-item">
        <span>Schedule</span>
      </a>
      <a routerLink="/paper-submission" routerLinkActive="active" class="nav-item">
        <span>Submission</span>
      </a>
      <a routerLink="/registration-payment" routerLinkActive="active" class="nav-item">
        <span>Registration</span>
      </a>
      <a routerLink="/review-execution" routerLinkActive="active" class="nav-item">
        <span>Reviews</span>
      </a>
    </ng-container>

    <!-- Reviewers only see Reviews -->
    <ng-container *ngIf="isReviewer">
      <a routerLink="/review-execution" routerLinkActive="active" class="nav-item">
        <span>Reviews</span>
      </a>
    </ng-container>

    <!-- Chairs only see Conference and Schedule -->
    <ng-container *ngIf="isChair">
      <a routerLink="/conference" routerLinkActive="active" class="nav-item">
        <span>Conferences</span>
      </a>
      <a routerLink="/scheduling-program" routerLinkActive="active" class="nav-item">
        <span>Schedule</span>
      </a>
      <a routerLink="/review-setup" routerLinkActive="active" class="nav-item">
        <span>Review Setup</span>
      </a>
    </ng-container>

    <!-- Regular users (authors) only see Submission and Registration -->
    <ng-container *ngIf="!isAdmin && !isReviewer && !isChair">
      <a routerLink="/paper-submission" routerLinkActive="active" class="nav-item">
        <span>Submission</span>
      </a>
      <a routerLink="/registration-payment" routerLinkActive="active" class="nav-item">
        <span>Registration</span>
      </a>
    </ng-container>
  </nav>

  <div class="user-area">

    <a *ngIf="isAdmin" routerLink="/admin-dashboard" routerLinkActive="active-admin" class="admin-pill">
      <span class="dot"></span> Admin Panel
    </a>

    <div *ngIf="isLoggedIn" class="divider"></div>

    <ng-container *ngIf="isLoggedIn; else loginTemplate">
      <div class="user-profile-trigger">
        <a routerLink="/user-profile" class="user-profile-link">
          <div class="avatar-circle">{{ userName.charAt(0) || 'U' }}</div>
          <div class="user-info">
            <span class="user-name">{{ userName || 'User' }}</span>
            <span class="user-role">{{ userRole }}</span>
          </div>
        </a>
        <button (click)="logout()" class="btn-logout" title="Logout">
          <span class="icon-logout">➜</span>
        </button>
      </div>
    </ng-container>

    <ng-template #loginTemplate>
      <a routerLink="/auth" class="btn-login">
        Sign In
      </a>
    </ng-template>
  </div>
</header>
